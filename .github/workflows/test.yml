name: Ilan API Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paketleri yukle
        run: pip install requests beautifulsoup4

      - name: Ilan sitesini test et
        run: python main.py
